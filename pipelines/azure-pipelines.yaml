trigger: none

appendCommitMessageToRunName: false

resources:
  pipelines:
    - pipeline: dpp
      source: dpp-app-build
      trigger:
        branches:
          include:
            - main
            - feature/*

pool:
  vmImage: ubuntu-latest

variables:
  - group: dpp-secrets

stages:
  - stage: Deploy
    jobs:
      - job: HelmDeploy
        steps:
          - script: |
              SOURCE_BRANCH="$(resources.pipeline.dpp.sourceBranch)"
              SAFE_NAMESPACE=$(echo "$SOURCE_BRANCH" | sed 's|refs/heads/||' | sed 's|/|-|g')
              echo "##vso[task.setvariable variable=safeNamespace]$SAFE_NAMESPACE"
            displayName: Compute namespace from branch

          - script: |
              SAFE_NS=$(safeNamespace)
              TRIGGER_RUN_ID="$(resources.pipeline.dpp.runID)"
              FRONTEND_TAG=$SAFE_NS-latest
              BACKEND_TAG=$SAFE_NS-latest

              if ! docker manifest inspect philipsutton/dpp-frontend:$SAFE_NS-$TRIGGER_RUN_ID > /dev/null 2>&1; then
                FRONTEND_TAG=main-latest
              fi

              if ! docker manifest inspect philipsutton/dpp-backend:$SAFE_NS-$TRIGGER_RUN_ID > /dev/null 2>&1; then
                BACKEND_TAG=main-latest
              fi

              echo "##vso[task.setvariable variable=frontendTag]$FRONTEND_TAG"
              echo "##vso[task.setvariable variable=backendTag]$BACKEND_TAG"
            displayName: Resolve image tags

          - task: AzureCLI@2
            displayName: Get kubeconfig and ingress IP
            inputs:
              azureSubscription: azure-ephemeral-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group dpp-ephemeral-dev \
                  --name dpp-aks \
                  --overwrite-existing

                IP=$(kubectl get svc ingress-nginx-controller \
                  -n ingress-nginx \
                  -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

                echo "##vso[task.setvariable variable=INGRESS_IP]$IP.nip.io"

          - task: AzureCLI@2
            displayName: Helm upgrade dpp
            inputs:
              azureSubscription: azure-ephemeral-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                which helm || curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

                helm upgrade dpp-$safeNamespace ./dpp-chart \
                  --namespace $safeNamespace \
                  --install \
                  --create-namespace \
                  --set frontend.image.tag=$frontendTag \
                  --set backend.image.tag=$backendTag \
                  --set ingress.baseDomain=$INGRESS_IP \
                  --set backend.configJson=$BACKEND_CONFIG_JSON \
                  --set deploymentId=$(Build.BuildId) \
                  --values dpp-chart/values.yaml

                echo "==> URL: https://$safeNamespace.$INGRESS_IP"
            env:
              safeNamespace: $(safeNamespace)
              INGRESS_IP: $(INGRESS_IP)
              BACKEND_CONFIG_JSON: $(BACKEND_CONFIG_JSON)
              frontendTag: $(frontendTag)
              backendTag: $(backendTag)
