trigger: none

resources:
  pipelines:
    - pipeline: dpp
      source: dpp-app-build
      trigger:
        branches:
          include:
            - main
            - feature/*

pool:
  vmImage: ubuntu-latest

variables:
  - group: dpp-secrets

stages:
  - stage: Deploy
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: HelmDeploy
        steps:
          - script: |
              SOURCE_BRANCH="$(resources.pipeline.dpp.sourceBranch)"
              SAFE_NAMESPACE=$(echo "$SOURCE_BRANCH" | sed 's|refs/heads/||' | sed 's|/|-|g')
              echo "==> Source branch: $SOURCE_BRANCH"
              echo "==> Safe namespace: $SAFE_NAMESPACE"
              echo "##vso[task.setvariable variable=safeNamespace]$SAFE_NAMESPACE"
            displayName: Compute namespace from branch

          - script: |
              echo "safeNamespace is: $(safeNamespace)"
            displayName: Verify namespace variable

          - task: AzureCLI@2
            displayName: Get kubeconfig
            inputs:
              azureSubscription: azure-ephemeral-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group dpp-ephemeral-dev \
                  --name dpp-aks \
                  --overwrite-existing

          - script: |
              kubectl create namespace $(safeNamespace) \
                --dry-run=client -o yaml | kubectl apply -f -
            displayName: Ensure namespace exists

          - task: HelmDeploy@0
            displayName: Helm upgrade dpp
            inputs:
              command: upgrade
              chartType: filepath
              chartPath: ./dpp-chart
              releaseName: dpp-$(safeNamespace)
              namespace: $(safeNamespace)
              install: true
              overrideValues: |
                frontend.image.tag=$(safeNamespace)-latest
                backend.image.tag=$(safeNamespace)-latest
                ingress.baseDomain=$(INGRESS_IP)
              valueFile: dpp-chart/values.yaml

          - script: |
              echo "==> URL: https://$(safeNamespace).$(INGRESS_IP)"
            displayName: Print environment URL
