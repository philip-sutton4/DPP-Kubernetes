trigger: none

appendCommitMessageToRunName: false

parameters:
  - name: action
    displayName: Action (for manual runs)
    type: string
    default: none
    values:
      - none
      - start
      - stop

schedules:
  - cron: "0 7 * * 1-5"
    displayName: start
    branches:
      include:
        - main
    always: true

  - cron: "0 19 * * 1-5"
    displayName: stop
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

stages:
  - stage: StartAKS
    displayName: Start AKS cluster
    condition: or(eq('${{ parameters.action }}', 'start'), eq(variables['Build.CronSchedule.DisplayName'], 'start'))
    jobs:
      - job: Start
        steps:
          - task: AzureCLI@2
            displayName: Start AKS cluster
            inputs:
              azureSubscription: azure-ephemeral-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks start \
                  --resource-group dpp-ephemeral-dev \
                  --name dpp-aks

  - stage: StopAKS
    displayName: Stop AKS cluster
    dependsOn: []
    condition: or(eq('${{ parameters.action }}', 'stop'), eq(variables['Build.CronSchedule.DisplayName'], 'stop'))
    jobs:
      - job: Stop
        steps:
          - task: AzureCLI@2
            displayName: Stop AKS cluster
            inputs:
              azureSubscription: azure-ephemeral-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks stop \
                  --resource-group dpp-ephemeral-dev \
                  --name dpp-aks