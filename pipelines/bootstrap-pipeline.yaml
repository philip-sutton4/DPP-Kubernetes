trigger: none

pool:
  vmImage: ubuntu-latest

parameters:
  - name: resourceGroup
    displayName: Resource Group
    type: string
    default: dpp-ephemeral-dev
  - name: location
    displayName: Location
    type: string
    default: polandcentral
  - name: clusterName
    displayName: Cluster Name
    type: string
    default: dpp-aks
  - name: nodeVmSize
    displayName: Node VM Size
    type: string
    default: Standard_B2s_v2
  - name: certEmail
    displayName: Email for Let's Encrypt
    type: string
    default: philip@sutton.pl
  - name: serviceConnection
    displayName: Azure Service Connection
    type: string
    default: azure-ephemeral-dev

stages:
  - stage: Bootstrap
    displayName: Bootstrap AKS cluster
    jobs:
      - job: Bootstrap
        timeoutInMinutes: 30
        steps:
          - task: AzureCLI@2
            displayName: Create resource group and deploy Bicep
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az group create \
                  --name ${{ parameters.resourceGroup }} \
                  --location ${{ parameters.location }}

                echo "==> Deploying Bicep..."
                az deployment group create \
                  --resource-group ${{ parameters.resourceGroup }} \
                  --template-file infra/main.bicep \
                  --parameters \
                    clusterName=${{ parameters.clusterName }} \
                    nodeVmSize=${{ parameters.nodeVmSize }}

          - task: AzureCLI@2
            displayName: Install ingress-nginx
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group ${{ parameters.resourceGroup }} \
                  --name ${{ parameters.clusterName }} \
                  --overwrite-existing

                EXISTS=$(kubectl get deployment ingress-nginx-controller \
                  -n ingress-nginx \
                  --ignore-not-found)

                if [ -z "$EXISTS" ]; then
                  echo "==> Installing ingress-nginx..."
                  kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

                  kubectl wait \
                    --namespace ingress-nginx \
                    --for=condition=ready pod \
                    --selector=app.kubernetes.io/component=controller \
                    --timeout=90s

                  kubectl rollout status deployment ingress-nginx-controller \
                    -n ingress-nginx
                else
                  echo "==> ingress-nginx already installed, skipping."
                fi

          - task: AzureCLI@2
            displayName: Install cert-manager
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group ${{ parameters.resourceGroup }} \
                  --name ${{ parameters.clusterName }} \
                  --overwrite-existing

                EXISTS=$(kubectl get deployment cert-manager \
                  -n cert-manager \
                  --ignore-not-found)

                if [ -z "$EXISTS" ]; then
                  echo "==> Installing cert-manager..."
                  kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml

                  kubectl wait \
                    --namespace cert-manager \
                    --for=condition=ready pod \
                    --selector=app.kubernetes.io/instance=cert-manager \
                    --timeout=120s
                else
                  echo "==> cert-manager already installed, skipping."
                fi

          - task: AzureCLI@2
            displayName: Apply ClusterIssuer
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group ${{ parameters.resourceGroup }} \
                  --name ${{ parameters.clusterName }} \
                  --overwrite-existing

                sed 's/your@email.com/${{ parameters.certEmail }}/' \
                  cert-manager/cluster-issuer.yaml | kubectl apply -f -

          - task: AzureCLI@2
            displayName: Get ingress IP
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group ${{ parameters.resourceGroup }} \
                  --name ${{ parameters.clusterName }} \
                  --overwrite-existing

                echo "==> Waiting for ingress IP..."
                until kubectl get svc ingress-nginx-controller \
                  -n ingress-nginx \
                  -o jsonpath='{.status.loadBalancer.ingress[0].ip}' \
                  2>/dev/null | grep -q .; do
                  echo "Waiting..."
                  sleep 5
                done

                IP=$(kubectl get svc ingress-nginx-controller \
                  -n ingress-nginx \
                  -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

                echo ""
                echo "==> Bootstrap complete."
                echo "    Ingress IP:      $IP"
                echo "    Base domain:     $IP.nip.io"
                echo "    Example URL:     https://main.$IP.nip.io"
