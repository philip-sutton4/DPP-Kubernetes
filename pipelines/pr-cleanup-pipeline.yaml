trigger: none

appendCommitMessageToRunName: false

resources:
  pipelines:
    - pipeline: dpp
      source: dpp-app-build
      trigger:
        branches:
          include:
            - main

schedules:
  - cron: "0 * * * *"
    displayName: Hourly namespace cleanup
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  - group: dpp-secrets

stages:
  - stage: Cleanup
    displayName: Clean stale feature namespaces
    jobs:
      - job: CleanStaleNamespaces
        timeoutInMinutes: 15
        steps:
          - task: AzureCLI@2
            displayName: Delete stale namespaces
            inputs:
              azureSubscription: azure-ephemeral-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group dpp-ephemeral-dev \
                  --name dpp-aks \
                  --overwrite-existing

                for ns in $(kubectl get namespaces \
                  -o jsonpath='{.items[*].metadata.name}'); do
                  [[ $ns != feature-* ]] && continue

                  BRANCH="feature/${ns#feature-}"

                  HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                    -H "Accept: application/vnd.github.v3+json" \
                    "https://api.github.com/repos/philip-sutton4/DPP-App/branches/$BRANCH")

                  if [ "$HTTP_STATUS" = "404" ]; then
                    helm uninstall dpp-$ns --namespace $ns --ignore-not-found 2>/dev/null
                    kubectl delete namespace $ns --ignore-not-found
                  elif [ "$HTTP_STATUS" != "200" ]; then
                    echo "Unexpected HTTP $HTTP_STATUS for $BRANCH, skipping."
                  fi
                done
