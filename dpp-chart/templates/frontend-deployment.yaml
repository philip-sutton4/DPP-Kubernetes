apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dpp-chart.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dpp-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "dpp-chart.selectorLabels" (dict "component" "frontend" "context" .) | nindent 6 }}
  template:
    metadata:
      annotations:
        deploymentId: {{ .Values.deploymentId | quote }}
      labels:
        {{- include "dpp-chart.labels" . | nindent 8 }}
        {{- include "dpp-chart.selectorLabels" (dict "component" "frontend" "context" .) | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP
