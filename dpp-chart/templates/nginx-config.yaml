apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dpp-chart.fullname" . }}-product-viewer-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dpp-chart.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        absolute_redirect off;
        location / {
            try_files $uri $uri/index.html =404;
        }
    }