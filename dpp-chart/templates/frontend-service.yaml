apiVersion: v1
kind: Service
metadata:
  name: {{ include "dpp-chart.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dpp-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "dpp-chart.selectorLabels" (dict "component" "frontend" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
