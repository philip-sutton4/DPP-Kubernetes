apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dpp-chart.fullname" . }}-backend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dpp-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
data:
  config.prod.json: {{ required "backend.configJson must be set" .Values.backend.configJson | quote }}
