# --------------------------------------------------------------------------
# Backend
# --------------------------------------------------------------------------
backend:
  image:
    repository: philipsutton/dpp-backend
    tag: main-latest
    pullPolicy: Always
  replicas: 1
  port: 8080
  metricsPort: 9464
  nodeEnv: prod
  configPath: /app/config/config.prod.json
  configJson: ""

# --------------------------------------------------------------------------
# Frontend
# --------------------------------------------------------------------------
frontend:
  image:
    repository: philipsutton/dpp-frontend
    tag: main-latest
    pullPolicy: Always
  replicas: 1
  port: 80

# --------------------------------------------------------------------------
# Product Viewer (nginx sidecar)
# --------------------------------------------------------------------------
productViewer:
  image:
    repository: nginx:alpine
    pullPolicy: IfNotPresent
  port: 80

# --------------------------------------------------------------------------
# Persistent storage
# --------------------------------------------------------------------------
htmlStorage:
  size: 1Gi

svgStorage:
  size: 1Gi

# --------------------------------------------------------------------------
# Ingress
# --------------------------------------------------------------------------
ingress:
  baseDomain: ""
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: letsencrypt-prod
