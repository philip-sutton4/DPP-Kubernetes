# --------------------------------------------------------------------------
# Backend
# --------------------------------------------------------------------------
backend:
  image:
    repository: dpp-backend
    tag: latest
    pullPolicy: Never
  replicas: 1
  port: 8080
  metricsPort: 9464
  nodeEnv: prod
  configPath: /app/config/config.prod.json
  # Base64-encoded config.prod.json — must be supplied at install time.
  # Example: helm install dpp-chart ./dpp-chart -n dpp --set backend.configJson=$(base64 -w0 config.prod.json)
  configJson: ""

# --------------------------------------------------------------------------
# Frontend
# --------------------------------------------------------------------------
frontend:
  image:
    repository: dpp-frontend
    tag: latest
    pullPolicy: Never
  replicas: 1
  port: 80

# --------------------------------------------------------------------------
# Product Viewer (nginx sidecar)
# --------------------------------------------------------------------------
productViewer:
  image:
    repository: nginx:alpine
    pullPolicy: IfNotPresent
  port: 80

# --------------------------------------------------------------------------
# Persistent storage
# --------------------------------------------------------------------------
htmlStorage:
  size: 1Gi

svgStorage:
  size: 1Gi

# --------------------------------------------------------------------------
# Ingress
# --------------------------------------------------------------------------
ingress:
  host: dpp.local
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
